services:
  postgres:
    image: postgres:14-alpine
    container_name: ticket-tracking-db
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-tickets_db}"
      POSTGRES_USER: "${POSTGRES_USER:-tickets_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-tickets_password}"
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - ticket_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ticket-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ticket-tracking:latest
    container_name: ticket-tracking-app
    environment:
      PORT: "${PORT:-8081}"
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-tickets_db}"
      DB_USER: "${DB_USER:-tickets_user}"
      DB_PASSWORD: "${DB_PASSWORD:-tickets_password}"
      DB_URL: "${DB_URL:-}"
      EMAIL_DELIVERY_MODE: "${EMAIL_DELIVERY_MODE:-log}"
      EMAIL_FROM: "${EMAIL_FROM:-mesa-ayuda@localhost}"
      EMAIL_MAX_ATTEMPTS: "${EMAIL_MAX_ATTEMPTS:-3}"
      EMAIL_RETRY_DELAY_MINUTES: "${EMAIL_RETRY_DELAY_MINUTES:-15}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-25}"
      SMTP_AUTH: "${SMTP_AUTH:-false}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_STARTTLS: "${SMTP_STARTTLS:-false}"
    ports:
      - "${APP_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    container_name: ticket-tracking-web
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./login.html:/usr/share/nginx/html/login.html:ro
      - ./employee.html:/usr/share/nginx/html/employee.html:ro
      - ./logo.png:/usr/share/nginx/html/logo.png:ro
      - ./universidad.jpg:/usr/share/nginx/html/universidad.jpg:ro
      - ./revimage.png:/usr/share/nginx/html/revimage.png:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ticket-api
    restart: unless-stopped

  adminer:
    image: adminer:4.8.1
    container_name: ticket-tracking-adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ticket_postgres_data:
