name: Java CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Ticket-Tracking-System-main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Validate Maven project
        run: mvn -B -ntp validate

      # The other test classes depend on an external PostgreSQL database or Windows browser drivers.
      - name: Build and run unit tests
        run: mvn -B -ntp clean verify -Dtest=EntityTests

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: Ticket-Tracking-System-main/target/surefire-reports/
          if-no-files-found: ignore
